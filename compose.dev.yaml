# Database only. Run the API and Vite directly on your machine.
name: find-a-loo-dev
services:
  db:
    image: postgis/postgis:17-3.5@sha256:01a6a70e41e6c4467c8f55f6063555ed72db2d6662cd0d571040d42eadaeb6f6
    platform: linux/amd64
    environment:
      POSTGRES_USER: loo_dev
      POSTGRES_DB: loo_dev
      POSTGRES_PASSWORD: ${DEV_DB_PASSWORD:?Copy .env.local.example to .env.local and set DEV_DB_PASSWORD}
    ports: ['127.0.0.1:${DEV_DB_PORT:-55432}:5432']
    volumes: [dev_postgres_data:/var/lib/postgresql/data]
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -h 127.0.0.1 -U loo_dev -d loo_dev']
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped
    cpus: '1.5'
    mem_limit: 1536m
    shm_size: 256m
volumes:
  dev_postgres_data:
