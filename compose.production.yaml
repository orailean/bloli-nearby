# Production explicitly binds the verified shared Bloli Nearby data volumes.
name: bloli-nearby
services:
  db:
    container_name: bloli-nearby-db
  api:
    image: ${BLOLI_API_IMAGE:-bloli-nearby-api:latest}
    container_name: bloli-nearby-api
  web:
    image: ${BLOLI_WEB_IMAGE:-bloli-nearby-web:latest}
    container_name: bloli-nearby-web
    ports: !reset []
    networks:
      default: {}
      edge:
        aliases: [bloli-nearby-web]
  importer:
    image: ${BLOLI_IMPORTER_IMAGE:-bloli-nearby-importer:latest}
networks:
  edge:
    external: true
    name: nginx_default

volumes:
  postgres_data:
    external: true
    name: ${POSTGRES_VOLUME:-bloli-nearby_postgres_data}
  import_data:
    external: true
    name: ${IMPORT_VOLUME:-bloli-nearby_import_data}
