# Contabo migration keeps the original Compose identity and explicit data mounts.
name: find-a-loo
services:
  db:
    container_name: bloli-nearby-db
  api:
    image: bloli-nearby-api:latest
    container_name: bloli-nearby-api
  web:
    image: bloli-nearby-web:latest
    container_name: bloli-nearby-web
    ports: !reset []
    networks:
      default: {}
      edge:
        aliases: [bloli-nearby-web]
  importer:
    image: bloli-nearby-importer:latest
networks:
  edge:
    external: true
    name: nginx_default

volumes:
  postgres_data:
    external: true
    name: ${POSTGRES_VOLUME:-find-a-loo_postgres_data}
  import_data:
    external: true
    name: ${IMPORT_VOLUME:-find-a-loo_import_data}
