server {
    listen 80;
    server_name view.bloli.com;
    access_log off;

    location ^~ /.well-known/acme-challenge/ {
        root /var/lib/dehydrated/acme-challenges;
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        return 301 https://view.bloli.com$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name view.bloli.com;

    ssl_certificate /etc/letsencrypt/live/view.bloli.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/view.bloli.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    access_log off;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    resolver 127.0.0.11 valid=30s ipv6=off;
    resolver_timeout 5s;

    include /etc/nginx/conf.d/bloli-nearby-proxy.inc;
}
