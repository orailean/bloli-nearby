server {
    listen 80;
    server_name kebab.bloli.com;
    access_log off;

    location ^~ /.well-known/acme-challenge/ {
        root /var/lib/dehydrated/acme-challenges;
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        default_type text/plain;
        return 200 "Kebab HTTPS setup in progress\n";
    }
}
