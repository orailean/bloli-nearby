map $host $site_shell {
    default "";
    loo.bloli.com /index-loo.html;
    kippe.bloli.com /index-kippe.html;
    kebab.bloli.com /index-kebab.html;
}
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    access_log off;
    server_tokens off;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Content-Type-Options nosniff always;
    resolver 127.0.0.11 valid=10s ipv6=off;
    location = /healthz { default_type text/plain; return 200 "ok\n"; }
    location /api/ {
        if ($site_shell = "") { return 421; }
        set $api http://api:3100;
        proxy_pass $api;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_set_header X-Forwarded-For $remote_addr;
        add_header Cache-Control "no-store" always;
        proxy_connect_timeout 5s;
        proxy_read_timeout 35s;
    }
    location /assets/ {
        if ($site_shell = "") { return 421; }
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
    location = / {
        if ($site_shell = "") { return 421; }
        try_files $site_shell =404;
        add_header Cache-Control "no-cache" always;
        add_header Vary Host always;
    }
    location ~ \.html$ { return 404; }
    location / {
        if ($site_shell = "") { return 421; }
        try_files $uri @site_shell;
        add_header Cache-Control "no-cache" always;
    }
    location @site_shell {
        try_files $site_shell =404;
        add_header Cache-Control "no-cache" always;
        add_header Vary Host always;
    }
}
